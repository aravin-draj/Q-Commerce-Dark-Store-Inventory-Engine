services:
  postgres:
    image: postgres:16-alpine
    container_name: qcommerce-postgres
    restart: always
    environment:
      POSTGRES_DB: darkstore_inventory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: qcommerce-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
    name: qcommerce_postgres_data
  redis_data:
    name: qcommerce_redis_data